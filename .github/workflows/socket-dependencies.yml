name: Socket dependency policy

on:
  workflow_call:
    inputs:
      ref:
        description: Optional ref for a source-built benchmark baseline
        type: string
        default: ""
    outputs:
      commit:
        description: Exact commit checked by the gate
        value: ${{ jobs.check.outputs.commit }}

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Check locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    env:
      RUSTC_WRAPPER: ""
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@09dddc697b1c8c1d3c3733b41d6fdd2274f17734
        with:
          egress-policy: audit
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Check dependencies without compiling or restoring caches
        shell: bash
        env:
          # Temporary workaround for Socket's dual-stack connection timeouts.
          NODE_OPTIONS: --no-network-family-autoselection
        run: |
          test -f Cargo.lock
          export CARGO_HOME
          CARGO_HOME="$(mktemp -d "$RUNNER_TEMP/socket-cargo-XXXXXX")"
          cargo_binary="$(rustup which cargo)"
          "$SFW_SHIM_DIR/cargo" fetch --locked 2>&1 | tee "$RUNNER_TEMP/socket-fetch.log"
          # Socket can return zero after an internal error. Fail closed.
          if grep -Fq 'Socket Firewall encountered an unexpected error' "$RUNNER_TEMP/socket-fetch.log"; then
            echo "::error::Socket encountered an internal error; dependency policy was not fully checked."
            exit 1
          fi
          # Confirm the fetch finished without allowing additional downloads.
          "$cargo_binary" fetch --frozen
      - name: Locate Socket report
        id: report
        if: ${{ always() }}
        run: |
          if [ -n "${SFW_JSON_REPORT_PATH:-}" ] && [ -f "$SFW_JSON_REPORT_PATH" ]; then
            echo "path=$SFW_JSON_REPORT_PATH" >> "$GITHUB_OUTPUT"
            echo "artifact-name=socket-report-$(basename "$SFW_JSON_REPORT_PATH" .json)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Socket did not produce a report file."
          fi
      - name: Upload Socket report
        if: ${{ always() && steps.report.outputs.path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.report.outputs.artifact-name }}
          # Upload only the report, never the temporary directory or fetch log.
          path: ${{ steps.report.outputs.path }}
          if-no-files-found: error
          retention-days: 3
